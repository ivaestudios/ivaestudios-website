<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vacantes · Panel | IVAE Studios</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Syne:wght@400;500;600;700&display=swap"/>
<style>
  :root{
    --navy:#0a0f17; --navy-2:#10182a; --cream:#faf8f5; --dim:rgba(250,248,245,.7);
    --gold:#c9a54e; --line:rgba(250,248,245,.12); --serif:'Cormorant Garamond',Georgia,serif; --sans:'Syne',system-ui,sans-serif;
    --ok:#7fd49a; --warn:#e5c97f; --info:#8fb8e5; --bad:#e58f8f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--navy);color:var(--cream);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1220px;margin:0 auto;padding:0 clamp(14px,3vw,40px)}
  header.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
  header.bar img{height:26px;width:auto}
  header.bar .t{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}

  .login{max-width:400px;margin:12vh auto 0;background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:34px;text-align:center}
  .login h1{font-family:var(--serif);font-weight:400;font-size:34px;margin:0 0 6px}
  .login p{color:var(--dim);font-size:13px;margin:0 0 20px}
  input[type=password], .search{
    width:100%;background:rgba(250,248,245,.05);border:1px solid var(--line);border-radius:8px;
    color:var(--cream);font-family:var(--sans);font-size:16px;padding:12px 14px;outline:none;
  }
  input:focus,.search:focus{border-color:var(--gold)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border-radius:8px;
    font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    padding:12px 20px;background:var(--gold);color:#141b26;border:1px solid var(--gold);transition:filter .2s}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--cream);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--gold);color:var(--gold);filter:none}
  .btn.danger{background:transparent;color:var(--bad);border-color:rgba(220,90,90,.35)}
  .btn.danger:hover{border-color:var(--bad);filter:none}
  .btn.sm{padding:10px 14px;font-size:10px;min-height:38px}
  .err{color:#f2b8b8;font-size:13px;margin-top:12px;display:none}

  .panel{display:none}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .tools .search{max-width:300px;flex:1 1 220px}
  .spacer{flex:1}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;color:var(--dim);cursor:pointer;background:transparent;font-family:var(--sans);transition:.2s}
  .chip b{color:var(--cream)}
  .chip.active{border-color:var(--gold);color:var(--gold)}
  .chip.active b{color:var(--gold)}

  .tbl{width:100%;border-collapse:collapse;background:var(--navy-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tbl-scroll{overflow-x:auto;border-radius:12px}
  th{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(250,248,245,.025)}
  td .nm{font-weight:600}
  td .sub{color:var(--dim);font-size:12px;margin-top:2px}
  td a{color:var(--gold);text-decoration:none}
  td a:hover{text-decoration:underline}
  .msgcell{max-width:300px;color:var(--dim);font-size:13px}
  .msgcell.full{white-space:pre-wrap}
  .msgcell:not(.full){display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .pill{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--dim);white-space:nowrap}
  select.estado{
    background:rgba(250,248,245,.05);border:1px solid var(--line);border-radius:999px;color:var(--cream);
    font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;outline:none;cursor:pointer;
  }
  select.estado option{background:var(--navy-2)}
  select.estado.e-nuevo{border-color:var(--info);color:var(--info)}
  select.estado.e-visto{border-color:var(--dim);color:var(--dim)}
  select.estado.e-entrevista{border-color:var(--warn);color:var(--warn)}
  select.estado.e-contratado{border-color:var(--ok);color:var(--ok)}
  select.estado.e-descartado{border-color:rgba(220,90,90,.5);color:var(--bad)}
  .empty{padding:70px 20px;text-align:center;color:var(--dim)}
  .empty .big{font-family:var(--serif);font-size:30px;color:var(--cream);margin-bottom:6px}
  .rowactions{display:flex;gap:10px;align-items:center}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy-2);border:1px solid var(--gold);
    color:var(--cream);border-radius:10px;padding:12px 22px;font-size:13px;display:none;z-index:50}

  /* ── móvil: tarjetas en vez de tabla ── */
  @media(max-width:760px){
    .tbl thead{display:none}
    .tbl, .tbl tbody, .tbl tr, .tbl td{display:block;width:100%}
    .tbl{border:none;background:transparent}
    .tbl tr{background:var(--navy-2);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:6px 2px}
    .tbl td{border:none;padding:8px 14px}
    td[data-l]::before{content:attr(data-l);display:block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
    .msgcell{max-width:none}
    .rowactions{display:flex;gap:8px;align-items:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <img src="/images/logo-ivae-h-cream.png" alt="IVAE Studios"/>
    <span class="t">Panel de vacantes</span>
  </header>

  <!-- LOGIN -->
  <div class="login" id="login">
    <h1>Vacantes</h1>
    <p>Entra con tu correo y contraseña para ver las postulaciones.</p>
    <form id="loginForm">
    <input type="email" id="user" placeholder="Correo" autocomplete="username" inputmode="email" style="margin-bottom:10px;width:100%;background:rgba(250,248,245,.05);border:1px solid var(--line);border-radius:8px;color:var(--cream);font-family:var(--sans);font-size:16px;padding:12px 14px;outline:none"/>
    <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password"/>
    <div style="margin-top:14px"><button class="btn" id="loginBtn" type="submit" style="width:100%">Entrar</button></div></form>
    <div class="err" id="loginErr">Correo o contraseña incorrectos.</div>
  </div>

  <!-- PANEL -->
  <div class="panel" id="panel">
    <div class="stats" id="stats"></div>
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="Buscar nombre, puesto, correo…"/>
      <span class="spacer"></span>
      <button class="btn ghost sm" id="csvBtn">⬇ Exportar CSV</button>
      <button class="btn ghost sm" id="refreshBtn">↻ Actualizar</button>
      <button class="btn ghost sm" id="logoutBtn">Salir</button>
    </div>
    <div class="tbl-scroll">
      <table class="tbl">
        <thead>
          <tr><th>Fecha</th><th>Candidato/a</th><th>Puesto</th><th>Estado</th><th>Contacto</th><th>Mensaje</th><th>CV</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">
      <div class="big">Aún no hay postulaciones</div>
      Comparte <a href="/vacantes" style="color:var(--gold)">ivaestudios.com/vacantes</a> para recibir CVs.
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var KEY = sessionStorage.getItem('careersKey') || '';
  var ESTADOS = ['nuevo','visto','entrevista','contratado','descartado'];
  var login = document.getElementById('login'), panel = document.getElementById('panel');
  var rowsEl = document.getElementById('rows'), all = [], filtroEstado = 'todos', q = '';

  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(function(){t.style.display='none';},2600); }
  function fmtDate(iso){
    try{ var d = new Date(iso);
      return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}) + '<div class="sub">' + d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}) + '</div>';
    }catch(e){ return iso||''; }
  }
  function fmtSize(b){ return b ? (b/1048576 >= 1 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB') : ''; }
  function esc(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function waLink(tel){ var d=(tel||'').replace(/\D/g,''); return d.length>=10 ? 'https://wa.me/'+(d.length===10?'52'+d:d) : null; }

  function filtered(){
    return all.filter(function(a){
      if (filtroEstado !== 'todos' && (a.estado||'nuevo') !== filtroEstado) return false;
      if (q && !((a.nombre+' '+a.email+' '+(a.puesto||'')+' '+(a.mensaje||'')).toLowerCase().includes(q))) return false;
      return true;
    });
  }

  function renderStats(){
    var counts = { todos: all.length };
    ESTADOS.forEach(function(e){ counts[e] = all.filter(function(a){ return (a.estado||'nuevo')===e; }).length; });
    var labels = { todos:'Todas', nuevo:'Nuevas', visto:'Vistas', entrevista:'Entrevista', contratado:'Contratadas', descartado:'Descartadas' };
    document.getElementById('stats').innerHTML = ['todos'].concat(ESTADOS).map(function(k){
      if (k!=='todos' && !counts[k]) return '';
      return '<button class="chip'+(filtroEstado===k?' active':'')+'" data-f="'+k+'"><b>'+counts[k]+'</b>&nbsp;'+labels[k]+'</button>';
    }).join('');
  }

  function render(){
    var list = filtered();
    rowsEl.innerHTML = list.map(function(a){
      var wa = waLink(a.telefono);
      var est = a.estado || 'nuevo';
      return '<tr>'
        + '<td data-l="Fecha" style="white-space:nowrap">' + fmtDate(a.created_at) + '</td>'
        + '<td data-l="Candidato/a"><div class="nm">' + esc(a.nombre) + '</div></td>'
        + '<td data-l="Puesto"><span class="pill">' + esc(a.puesto||'Sin puesto') + '</span></td>'
        + '<td data-l="Estado"><select class="estado e-'+est+'" data-id="'+a.id+'">'
        +   ESTADOS.map(function(e){ return '<option value="'+e+'"'+(e===est?' selected':'')+'>'+e.charAt(0).toUpperCase()+e.slice(1)+'</option>'; }).join('')
        + '</select></td>'
        + '<td data-l="Contacto"><a href="mailto:' + esc(a.email) + '">' + esc(a.email) + '</a>'
        +   (a.telefono ? '<div class="sub">' + (wa ? '<a href="'+wa+'" target="_blank" rel="noopener">' : '') + esc(a.telefono) + (wa?'</a>':'') + '</div>' : '')
        + '</td>'
        + '<td data-l="Mensaje"><div class="msgcell" role="button" tabindex="0">' + esc(a.mensaje||'') + '</div></td>'
        + '<td data-l="CV" style="white-space:nowrap"><div class="rowactions"><button class="btn ghost sm" data-cv="' + a.id + '">Abrir CV</button><span class="sub">' + fmtSize(a.cv_size) + '</span></div></td>'
        + '<td><button class="btn danger sm" data-del="' + a.id + '" data-nm="' + esc(a.nombre) + '" aria-label="Eliminar">✕</button></td>'
        + '</tr>';
    }).join('');
    renderStats();
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';
    document.querySelector('.tbl-scroll').style.display = list.length ? '' : 'none';
  }

  function load(){
    fetch('/api/careers', { headers:{ 'Authorization':'Bearer '+KEY } })
      .then(function(r){ if(r.status===401) throw 'auth'; if(!r.ok) throw 'server'; return r.json(); })
      .then(function(d){
        if (!d || d.ok !== true || !Array.isArray(d.applications)) throw 'server';
        all = d.applications;
        login.style.display='none'; panel.style.display='block';
        sessionStorage.setItem('careersKey', KEY);
        render();
      })
      .catch(function(e){
        if (e === 'auth') {
          sessionStorage.removeItem('careersKey');
          login.style.display='block'; panel.style.display='none';
          if (KEY) document.getElementById('loginErr').style.display='block';
          KEY='';
        } else if (panel.style.display === 'block') {
          toast('No se pudo actualizar, revisa tu conexión y reintenta');
        } else {
          document.getElementById('loginErr').textContent = 'No se pudo conectar. Intenta de nuevo.';
          document.getElementById('loginErr').style.display = 'block';
        }
      });
  }

  function exportCsv(){
    var cols = ['created_at','nombre','puesto','estado','email','telefono','mensaje','cv_name'];
    var head = ['Fecha','Nombre','Puesto','Estado','Correo','Teléfono','Mensaje','CV'];
    var lines = [head.join(',')].concat(filtered().map(function(a){
      return cols.map(function(c){ var v = String(a[c]==null?'':a[c]).replace(/"/g,'""'); return '"'+v+'"'; }).join(',');
    }));
    var blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
    var u = URL.createObjectURL(blob), el = document.createElement('a');
    el.href=u; el.download='vacantes-ivae-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(el); el.click(); el.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},4000);
    toast('CSV exportado ✓');
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){ e.preventDefault(); KEY = document.getElementById('user').value.trim().toLowerCase() + ':' + document.getElementById('pw').value; load(); });
  document.getElementById('refreshBtn').addEventListener('click', function(){ load(); toast('Actualizado ✓'); });
  document.getElementById('logoutBtn').addEventListener('click', function(){ sessionStorage.removeItem('careersKey'); location.reload(); });
  document.getElementById('csvBtn').addEventListener('click', exportCsv);
  document.getElementById('search').addEventListener('input', function(e){ q = e.target.value.toLowerCase(); render(); });

  document.addEventListener('click', function(e){
    var chip = e.target.closest('[data-f]');
    if (chip) { filtroEstado = chip.getAttribute('data-f'); render(); return; }
    var msg = e.target.closest('.msgcell');
    if (msg) { msg.classList.toggle('full'); return; }
    var cv = e.target.closest('[data-cv]');
    if (cv) {
      cv.disabled = true;
      var win = window.open('about:blank', '_blank');
      if (win) { try { win.document.write('<title>Abriendo CV…</title><body style="background:#0a0f17;color:#faf8f5;font-family:sans-serif;display:grid;place-items:center;height:100vh;margin:0">Abriendo CV…</body>'); } catch(err) {} }
      fetch('/api/careers/cv/' + cv.getAttribute('data-cv'), { headers:{ 'Authorization':'Bearer '+KEY } })
        .then(function(r){ if(!r.ok) throw 0;
          var type = r.headers.get('content-type') || 'application/pdf';
          return r.blob().then(function(b){ return new Blob([b], {type:type}); });
        })
        .then(function(b){
          var u = URL.createObjectURL(b);
          if (win) win.location = u; else window.open(u, '_blank');
          setTimeout(function(){ URL.revokeObjectURL(u); }, 120000);
        })
        .catch(function(){ if (win) win.close(); toast('No se pudo abrir el CV'); })
        .finally(function(){ cv.disabled = false; });
      return;
    }
    var del = e.target.closest('[data-del]');
    if (del && confirm('¿Eliminar la postulación de ' + del.getAttribute('data-nm') + '? Esto borra también su CV.')) {
      fetch('/api/careers/' + del.getAttribute('data-del'), { method:'DELETE', headers:{ 'Authorization':'Bearer '+KEY } })
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d && d.ok) { toast('Postulación eliminada'); load(); } else toast('No se pudo eliminar'); })
        .catch(function(){ toast('No se pudo eliminar'); });
    }
  });

  document.addEventListener('change', function(e){
    var sel = e.target.closest('select.estado');
    if (!sel) return;
    var id = sel.getAttribute('data-id'), estado = sel.value;
    fetch('/api/careers/' + id, {
      method:'PATCH',
      headers:{ 'Authorization':'Bearer '+KEY, 'content-type':'application/json' },
      body: JSON.stringify({ estado: estado })
    })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.ok) {
          var a = all.find(function(x){ return x.id === id; });
          if (a) a.estado = estado;
          sel.className = 'estado e-' + estado;
          renderStats();
          toast('Estado: ' + estado + ' ✓');
        } else toast('No se pudo actualizar');
      })
      .catch(function(){ toast('No se pudo actualizar'); });
  });

  document.addEventListener('keydown', function(e){
    if (e.key==='Enter' && e.target.classList && e.target.classList.contains('msgcell')) e.target.classList.toggle('full');
  });

  if (KEY) load();
})();
</script>
</body>
</html>
