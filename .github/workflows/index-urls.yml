name: SEO — Index URLs

# Auto-fires on push to main when user-facing content changes.
# Also supports manual runs from the Actions tab with a custom URL list.
on:
  schedule:
    - cron: '20 8 * * *'   # 08:20 UTC. La cuota diaria se reinicia a medianoche del Pacifico: 08:00 UTC en invierno, 07:00 UTC en verano
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "_redirects"
      - ".github/workflows/index-urls.yml"
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to index (leave blank to use default list)"
        required: false
        default: ""

concurrency:
  group: seo-index-urls
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit:
    name: Submit to Google Indexing API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Submit URLs
        env:
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: |
          # Medido el 2026-09-23: este flujo corrio 12 veces en un dia (cada push
          # que toca un .html) y cada vez mandaba las MISMAS 26 URLs por defecto:
          # 312 envios repetidos, la cuota diaria de 200 entera, y los envios
          # dirigidos desde el Mac recibian QUOTA al instante.
          # Medido el 2026-11-11: 11 pushes mandaron directo sus paginas cambiadas,
          # se acabaron las 200 del dia y la corrida diaria de la cola no mando
          # ninguna de sus 140 (paginas que Google todavia no tiene).
          # Por eso el push ya NO manda nada: solo agrega sus paginas cambiadas al
          # final de la cola. La corrida diaria manda la cola (140) y bodasmx las
          # otras 60. Lo urgente se manda a mano: Run workflow con las URLs.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -n "${{ github.event.inputs.urls }}" ]; then
              python scripts/index_urls.py ${{ github.event.inputs.urls }}
            else
              python scripts/index_urls.py
            fi
          else
            ANTES="${{ github.event.before }}"
            if ! git cat-file -e "$ANTES" 2>/dev/null; then ANTES="${{ github.sha }}~1"; fi
            CAMBIADOS=$(git diff --name-only --diff-filter=AM "$ANTES" "${{ github.sha }}" -- '*.html' \
              | grep -vE '(^|/)(_|tools/|marketing/|preview|index-preview|-preview)' \
              | grep -vE '^(404|admin|accessibility-statement|privacy-policy)\.html$' \
              | grep -vE 'preview[^/]*\.html$' \
              | sed -E 's|^index\.html$||; s|^es/index\.html$|es/|; s|\.html$||' \
              | sed -E 's|^|https://ivaestudios.com/|' | head -300)
            if [ -z "$CAMBIADOS" ]; then echo "Sin HTML cambiado en este push: nada que encolar."; exit 0; fi
            echo "$CAMBIADOS" | sed 's/^/  /'
            python scripts/index_urls.py --encolar $CAMBIADOS
          fi

      - name: Guardar el avance de la cola de Google
        # Corrida diaria o manual sin URLs: index_urls.py quita de la cola las
        # URLs que Google acepto. Push: index_urls.py --encolar agrego al final
        # las paginas que cambiaron. En los dos casos se guarda el archivo.
        run: |
          if ! git diff --quiet -- seo/google-queue.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seo/google-queue.txt
            git commit -m "seo: avance de la cola de Google [skip ci]"
            git pull --rebase -q origin main
            git push -q origin HEAD:main
          fi
