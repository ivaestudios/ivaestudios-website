name: SEO — IndexNow on push

# Submits changed URLs to Bing IndexNow whenever HTML / sitemap content
# changes on main. Skips silently if BING_INDEXNOW_KEY is not set, so the
# workflow can land before the secret is provisioned.

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'es/**.html'
      - 'blog/**'
      - 'es/blog/**'
      - 'venues/**'
      - 'comparison/**'
      - 'sitemap.xml'
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to submit (blank = use sitemap)"
        required: false
        type: string

concurrency:
  group: seo-indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    name: Submit to Bing IndexNow
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # IndexNow used to fire 25 to 82 s before Cloudflare Pages finished
      # publishing, so a fast crawler could fetch the previous version.
      # On 2026-11-15 a deploy took about 8 minutes and Bingbot got a 404 on a
      # brand-new page, so new pages are also polled until they answer 200
      # (up to 13 minutes) before IndexNow is pinged.
      - name: Wait for Cloudflare Pages to publish
        run: |
          sleep 150
          git diff --name-only --diff-filter=A HEAD~1 HEAD -- '*.html' 'es/*.html' 'blog/*' 'es/blog/*' 'venues/*' 'comparison/*' > /tmp/nuevas.txt || true
          while read -r f; do
            [ -z "$f" ] && continue
            p="${f%.html}"; p="${p%/index}"; [ "$p" = "index" ] && p=""
            u="https://ivaestudios.com/${p}"
            c=000
            for i in $(seq 1 26); do
              c=$(curl -s -o /dev/null -w '%{http_code}' "${u}?indexnow=$(date +%s)")
              [ "$c" = "200" ] && break
              sleep 30
            done
            echo "$c $u"
          done < /tmp/nuevas.txt

      - name: Submit to IndexNow
        env:
          BING_INDEXNOW_KEY: ${{ secrets.BING_INDEXNOW_KEY }}
        run: python3 scripts/indexnow_submit.py --since-last-deploy
