name: SEO — Index bodasmx.com.mx

# bodasmx tiene ~930 URLs y la cuota de la Indexing API son 200 al dia,
# compartida con ivaestudios.com. Este job empuja 180 diarias y lleva un
# cursor, asi que el sitio entero entra solo en unos cinco dias y despues
# sigue revisitando. Google no acepta IndexNow: sin esto, un dominio joven
# como bodasmx puede tardar meses en indexarse.
on:
  schedule:
    # 09:20 UTC = 03:20 en Cancun. La cuota de Google se reinicia a
    # medianoche del Pacifico (02:00 Cancun), asi que a esta hora ya
    # esta fresca y todavia no la gasto el push de ivaestudios.
    - cron: "20 9 * * *"
  workflow_dispatch:

concurrency:
  group: seo-index-bodasmx
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit:
    name: Empujar 180 URLs de bodasmx a Google
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Enviar lote diario
        env:
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: python scripts/index_bodasmx_diario.py

      - name: Guardar el cursor
        run: |
          if [ -n "$(git status --porcelain seo/data/bodasmx_index_cursor.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seo/data/bodasmx_index_cursor.json
            git commit -m "seo: avance del indexado de bodasmx [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              sleep $((i * 10))
            done
          else
            echo "sin cambios en el cursor (cuota agotada): nada que guardar"
          fi
