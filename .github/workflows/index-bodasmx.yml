name: SEO — Index bodasmx.com.mx

# bodasmx tiene ~930 URLs y la cuota de la Indexing API son 200 al dia,
# compartida con ivaestudios.com. Este job empuja 60 diarias y lleva un
# cursor. Empujaba 180, pero el sitio ya dio dos o tres vueltas completas y
# ahora solo revisita, mientras a ivaestudios le quedaban 20 al dia y sus
# paginas de dinero se quedaban sin rastrear. Google no acepta IndexNow: sin esto, un dominio joven
# como bodasmx puede tardar meses en indexarse.
on:
  schedule:
    # 09:20 UTC = 03:20 en Cancun. La cuota de Google se reinicia a
    # medianoche del Pacifico (02:00 Cancun), asi que a esta hora ya
    # esta fresca y todavia no la gasto el push de ivaestudios.
    - cron: "20 9 * * *"
  workflow_dispatch:

concurrency:
  group: seo-index-bodasmx
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit:
    name: Empujar 60 URLs de bodasmx a Google
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Enviar lote diario
        env:
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: python scripts/index_bodasmx_diario.py


      - name: Avisar a Bing por IndexNow
        # La clave de bodasmx es publica por diseno: se sirve como archivo en
        # la raiz del sitio, que es justo como IndexNow verifica la propiedad.
        # No hace falta secreto. Google no acepta IndexNow, Bing si, y bodasmx
        # no lo estaba usando pese a tener la clave puesta desde el inicio.
        run: |
          python - <<'PY'
          import json, re, urllib.request
          CLAVE = "bc79d453a30c728a132ca01f860d240897d6c2cdda4947629eb5cc59bb0da1ef"
          BASE = "https://bodasmx.com.mx"

          def bajar(u):
              req = urllib.request.Request(u, headers={"User-Agent": "IVAE-SEO/1.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode("utf-8", "replace")

          indice = bajar(f"{BASE}/sitemap.xml")
          hijos = re.findall(r"<loc>([^<]+)</loc>", indice)
          urls = []
          if "<sitemapindex" in indice:
              for h in hijos:
                  urls += re.findall(r"<loc>([^<]+)</loc>", bajar(h))
          else:
              urls = hijos
          urls = sorted({u.strip() for u in urls if u.startswith("http")})
          print(f"{len(urls)} URLs en los sitemaps de bodasmx")

          enviadas = 0
          for i in range(0, len(urls), 500):
              trozo = urls[i:i + 500]
              cuerpo = json.dumps({
                  "host": "bodasmx.com.mx",
                  "key": CLAVE,
                  "keyLocation": f"{BASE}/{CLAVE}.txt",
                  "urlList": trozo,
              }).encode()
              req = urllib.request.Request(
                  "https://api.indexnow.org/indexnow", data=cuerpo,
                  headers={"Content-Type": "application/json; charset=utf-8"},
                  method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      print(f"  lote {i // 500 + 1}: {len(trozo)} URLs -> HTTP {r.status}")
                      enviadas += len(trozo)
              except Exception as e:
                  print(f"  lote {i // 500 + 1}: fallo {e}")
          print(f"enviadas {enviadas} de {len(urls)}")
          PY

      - name: Guardar el cursor
        run: |
          if [ -n "$(git status --porcelain seo/data/bodasmx_index_cursor.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seo/data/bodasmx_index_cursor.json
            git commit -m "seo: avance del indexado de bodasmx [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              sleep $((i * 10))
            done
          else
            echo "sin cambios en el cursor (cuota agotada): nada que guardar"
          fi
