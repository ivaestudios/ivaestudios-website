name: SEO — Control de indexacion

# El libro de indexacion: cada mañana le pregunta a Google, pagina por pagina,
# cuales ya entraron y cuales faltan en ivaestudios.com y bodasmx.com.mx, y
# rellena las colas de envio para que ninguna pagina nueva se quede sin mandar.
# Resultado legible: seo/control/INDEXACION.md
on:
  schedule:
    # 10:30 UTC = 5:30 am en Cancun, despues de los envios de las 08:20 (ivaestudios)
    # y las 09:20 (bodasmx): asi el libro ve lo que ya salio de las colas.
    - cron: '30 10 * * *'
  workflow_dispatch: {}

concurrency:
  group: control-indexacion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  control:
    name: Revisar en Google y rellenar las colas
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Control diario
        env:
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: python3 scripts/control_indexacion.py

      # Que robots de IAs y buscadores leyeron el sitio (Claude, ChatGPT, Meta...).
      # Nunca detiene el control: si el registro no contesta, solo avisa.
      - name: Robots que leyeron el sitio
        continue-on-error: true
        env:
          RASTREO_INFORME_URL: ${{ secrets.RASTREO_INFORME_URL }}
          RASTREO_CLAVE: ${{ secrets.RASTREO_CLAVE }}
        run: python3 scripts/robots_ia.py

      - name: Guardar el libro
        run: |
          git add seo/control seo/google-queue.txt seo/bodasmx-queue.txt
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "seo: control diario de indexacion [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q --autostash origin main && git push -q origin HEAD:main && break
            sleep $((i * 10))
          done
