name: SEO — FAQ visible

# Google pide que el marcado FAQPage refleje contenido visible. Esta compuerta
# falla el push si alguna pagina indexable declara preguntas que nadie ve.

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "scripts/auditar_faq.py"
      - "scripts/auditar_marcado.py"
      - ".github/workflows/faq-audit.yml"
  workflow_dispatch:

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preguntas declaradas contra preguntas visibles
        run: python3 scripts/auditar_faq.py
      - name: Enlaces mal puestos y entidades en datos estructurados
        # Un <a> dentro de un alt deja codigo a la vista; un <a> dentro de otro
        # parte las tarjetas; un &amp; dentro del JSON-LD se lee literal.
        if: always()
        run: python3 scripts/auditar_marcado.py
