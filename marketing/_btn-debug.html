<!doctype html><html lang="es" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>debug btn</title>
<link rel="stylesheet" href="/marketing/css/app.css">
<link rel="stylesheet" href="/marketing/css/shell.css">
<link rel="stylesheet" href="/marketing/css/theme-light.css">
<style>body{padding:16px;font:13px/1.5 -apple-system,sans-serif}pre{white-space:pre-wrap;background:#eee;padding:8px;border-radius:8px}</style>
</head><body>
<div class="sheet__footer"><button class="btn">Cancelar</button><button class="btn btn-primary sheet-cta" id="b">Eliminar definitivamente</button></div>
<pre id="out">midiendo…</pre>
<script>
const b=document.getElementById('b'); const cs=getComputedStyle(b); const r=getComputedStyle(document.documentElement);
document.getElementById('out').textContent = JSON.stringify({
  brand: r.getPropertyValue('--brand').trim(),
  grad: r.getPropertyValue('--grad').trim().slice(0,40),
  bgColor: cs.backgroundColor,
  bgImage: cs.backgroundImage.slice(0,70),
  color: cs.color,
  opacity: cs.opacity,
  cssCargado: [...document.styleSheets].map(s=>{try{return s.cssRules.length}catch(e){return 'X'}}).join(','),
}, null, 1);
</script></body></html>
